<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Lexora</title>
  <script type="text/javascript">
    // Redirect to index.html with the original path preserved
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/Lexora-Client/index.html?p=' +
      l.pathname.slice(0, l.pathname.lastIndexOf('/') + 1).slice(0, -pathSegmentsToKeep).replace(/&/g, '~and~') +
      '&q=' + l.search.slice(1).replace(/&/g, '~and~') +
      l.hash
    );
  </script>
</head>

<body>
</body>

</html>
